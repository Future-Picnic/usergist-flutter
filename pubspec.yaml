name: usergist_feedback
description: userGist mobile feedback SDK for Flutter. Lightweight, GDPR-aware, offline-first event ingest and native prompt rendering.
version: 0.1.0
homepage: https://usergist.com
repository: https://github.com/Future-Picnic/usergist-flutter
issue_tracker: https://github.com/Future-Picnic/usergist-flutter/issues
documentation: https://usergist.com/docs/sdks/flutter
topics:
  - analytics
  - feedback
  - push-notifications
  - surveys

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

platforms:
  android:
  ios:

dependencies:
  crypto: ^3.0.3
  device_info_plus: ^10.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.2.1
  package_info_plus: ^8.0.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
